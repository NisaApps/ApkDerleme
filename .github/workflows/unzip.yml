name: ZIP'i aç
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP'i aç
        run: |
          unzip -q DynamicIsland.zip -d /tmp/src
          rsync -a --exclude '.github' /tmp/src/DynamicIsland/ ./
          rm DynamicIsland.zip
      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Proje dosyaları eklendi"
          git push
