name: APK Derle

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: ZIP dosyasını aç
        run: unzip -o DynamicIsland.zip

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Debug APK derle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: DynamicIsland
        run: gradle assembleDebug --stacktrace

      - name: Debug APK'yı yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-debug
          path: DynamicIsland/app/build/outputs/apk/debug/*.apk

      - name: Release APK derle
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: DynamicIsland
        run: gradle assembleRelease --stacktrace

      - name: Release APK'yı adlandır ve SHA-256 hesapla
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cp DynamicIsland/app/build/outputs/apk/release/app-release-unsigned.apk app-release.apk
          sha256sum app-release.apk | tee app-release.apk.sha256

      - name: GitHub Release yayınla
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            app-release.apk.sha256
          generate_release_notes: true
